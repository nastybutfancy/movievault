<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>MovieVault</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
</head>
<body>
  <header>🎬 MovieVault</header>

  <main>
    <button id="scanButton" class="button scan">📷 Skanuj kod</button>
    <button id="closeScannerButton" class="button secondary hidden">Zamknij skaner</button>

    <section id="scannerPanel" class="panel hidden">
      <video id="preview" playsinline muted></video>
      <p class="hint">Umieść kod kreskowy pośrodku obrazu.</p>
    </section>

    <section id="resultPanel" class="panel hidden"></section>

    <button id="searchButton" class="button search">🔍 Szukaj filmu</button>
    <button id="addButton" class="button add">➕ Dodaj film</button>

    <section id="searchPanel" class="panel hidden">
      <h2>Szukaj</h2>
      <input id="searchQuery" placeholder="Tytuł albo kod">
      <button id="runSearchButton" class="button search">Szukaj</button>
      <div id="searchResults"></div>
    </section>

    <section id="addPanel" class="panel hidden">
      <h2>Dodaj film</h2>
      <label>Kod kreskowy</label>
      <input id="barcode" inputmode="numeric">

      <label>Tytuł</label>
      <input id="title">

      <label>Format</label>
      <select id="format">
        <option>DVD</option>
        <option>Blu-ray</option>
        <option>4K UHD</option>
      </select>

      <label>Rok</label>
      <input id="year" inputmode="numeric">

      <label>Półka</label>
      <input id="shelf">

      <button id="saveButton" class="button add">Zapisz film</button>
    </section>

    <section class="panel">
      <h2>Kolekcja lokalna</h2>
      <div class="stats">
        <div>DVD<strong id="dvd">0</strong></div>
        <div>Blu-ray<strong id="bluray">0</strong></div>
        <div>4K UHD<strong id="uhd">0</strong></div>
        <div>Razem<strong id="total">0</strong></div>
      </div>
      <p class="hint">W tej wersji dane są zapisane w telefonie. Synchronizację z Arkuszem Google dodamy w kolejnym kroku.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
