<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>MovieVault 2.0</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=20">
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Twoja filmoteka</p>
      <h1>MovieVault</h1>
    </div>
    <button id="refreshButton" class="icon-button" type="button" aria-label="Odśwież">↻</button>
  </header>

  <main class="app-shell">
    <section id="homeView" class="view">
      <div class="hero">
        <div>
          <p class="hero-kicker">Domowe kino pod kontrolą</p>
          <h2>Wszystkie filmy. Jedna półka w kieszeni.</h2>
        </div>

        <div class="stats-grid">
          <article><strong id="totalStat">0</strong><span>Wszystkie</span></article>
          <article><strong id="dvdStat">0</strong><span>DVD</span></article>
          <article><strong id="blurayStat">0</strong><span>Blu-ray</span></article>
          <article><strong id="uhdStat">0</strong><span>4K</span></article>
        </div>
      </div>

      <div class="action-grid">
        <button id="openScannerButton" class="primary-card" type="button">📷<span>Skanuj kod</span></button>
        <button id="openCollectionButton" class="primary-card" type="button">🎞️<span>Kolekcja</span></button>
        <button id="openAddButton" class="primary-card" type="button">➕<span>Dodaj film</span></button>
        <button id="openSearchButton" class="primary-card" type="button">🔎<span>Szukaj</span></button>
      </div>
    </section>

    <section id="collectionView" class="view hidden">
      <div class="section-toolbar">
        <div>
          <p class="eyebrow">Biblioteka</p>
          <h2>Moja kolekcja</h2>
        </div>
        <button class="ghost-button back-home" type="button">Wróć</button>
      </div>

      <div class="filters">
        <input id="collectionFilter" type="search" placeholder="Tytuł, rok, format, półka...">
        <select id="collectionSort">
          <option value="title">Alfabetycznie</option>
          <option value="newest">Najnowsze wpisy</option>
          <option value="oldest">Najstarsze wpisy</option>
          <option value="year">Rok filmu</option>
        </select>
      </div>

      <p id="collectionCount" class="muted"></p>
      <div id="collectionGrid" class="poster-grid"></div>
    </section>

    <section id="formView" class="view hidden">
      <div class="section-toolbar">
        <div>
          <p id="formEyebrow" class="eyebrow">Nowy wpis</p>
          <h2 id="formTitle">Dodaj film</h2>
        </div>
        <button id="cancelFormButton" class="ghost-button" type="button">Anuluj</button>
      </div>

      <form id="movieForm" class="movie-form">
        <label>Kod kreskowy<input id="barcodeInput" inputmode="numeric" required></label>
        <label>Tytuł<input id="titleInput" required></label>
        <label>Format
          <select id="formatInput" required>
            <option value="DVD">DVD</option>
            <option value="Blu-ray">Blu-ray</option>
            <option value="4K UHD">4K UHD</option>
          </select>
        </label>
        <label>Rok<input id="yearInput" inputmode="numeric"></label>
        <label>Półka<input id="shelfInput"></label>
        <label>Uwagi<textarea id="notesInput" rows="3"></textarea></label>

        <div class="tmdb-box">
          <div class="tmdb-toolbar">
            <strong>Dane z TMDb</strong>
            <button id="tmdbSearchButton" class="secondary-button" type="button">Znajdź film</button>
          </div>
          <div id="tmdbStatus" class="muted"></div>
          <div id="tmdbResults" class="tmdb-results"></div>
          <div id="selectedTmdb" class="selected-tmdb hidden">
            <img id="selectedPoster" alt="">
            <div>
              <strong id="selectedTmdbTitle"></strong>
              <p id="selectedTmdbDetails" class="muted"></p>
            </div>
          </div>
        </div>

        <button id="saveMovieButton" class="save-button" type="submit">Zapisz film</button>
      </form>
    </section>

    <section id="scannerView" class="view hidden">
      <div class="section-toolbar">
        <div>
          <p class="eyebrow">Skaner</p>
          <h2>Zeskanuj kod</h2>
        </div>
        <button id="closeScannerButton" class="ghost-button" type="button">Zamknij</button>
      </div>
      <video id="scannerPreview" playsinline></video>
      <p id="scannerStatus" class="muted">Skieruj aparat na kod kreskowy.</p>
    </section>

    <section id="searchView" class="view hidden">
      <div class="section-toolbar">
        <div>
          <p class="eyebrow">Wyszukiwarka</p>
          <h2>Szukaj w kolekcji</h2>
        </div>
        <button class="ghost-button back-home" type="button">Wróć</button>
      </div>
      <div class="filters search-row">
        <input id="searchInput" type="search" placeholder="Tytuł lub kod">
        <button id="runSearchButton" class="secondary-button" type="button">Szukaj</button>
      </div>
      <div id="searchResults" class="list-results"></div>
    </section>
  </main>

  <dialog id="detailsDialog" class="movie-dialog">
    <button id="closeDialogButton" class="dialog-close" type="button">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script type="module" src="./app.js?v=20"></script>
</body>
</html>
